[package]
name = "funboy-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
ollama-rs.workspace = true
funboy-core = { path = "../funboy-core" }
fsl_interpreter = { version = "0.1.0", path = "../../fsl_interpreter" }
async-recursion = "1.1.1"
tokio = {version = "1.39.2", features = ["full"]}
dotenvy = "0.15.7"
sqlx = {version = "0.9.0-alpha.1", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate"]}
rustyline = "18.0.0"
clap = { version = "4.5.0", features = ["derive"] }
