[package]
name = "funboy-discord"
version = "0.1.0"
edition = "2024"

[dependencies]
ollama-rs.workspace = true
reqwest.workspace = true
fsl-core.workspace = true
funboy-core = { path = "../funboy-core" }
funboy-cli = { path = "../funboy-cli" }
time = "=0.3.47" 
sqlx = {version = "0.9.0-alpha.1", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate"]}
poise = "0.6.1"
tokio = {version = "1.39.2", features = ["full"]}
rand = "0.9.2"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.132"
async-recursion = "1.1.1"
dotenvy = "0.15.7"
clap = "4.6.1"
strum = { version = "0.28.0", features = ["strum_macros"] }

[dependencies.serenity]
default-features = false
features = ["cache", "builder", "client", "gateway", "model", "utils", "collector", "framework", "voice"]
version = "0.12.2"

[dependencies.songbird]
version = "0.6.0"
features = ["builtin-queue"]

[dependencies.symphonia]
version = "0.5.2"
features = ["mp3", "aac", "isomp4", "alac"]

[dependencies.uuid]
version = "1.10.0"
features = [
    "v4",                # Lets you generate random UUIDs
]
